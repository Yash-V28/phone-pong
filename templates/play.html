<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Phone Pong - Controller</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #000;
      color: #fff;
      font-family: "Press Start 2P", monospace;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    .controller {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 1rem;
      padding: max(1rem, env(safe-area-inset-top)) 1rem max(1rem, env(safe-area-inset-bottom));
      text-align: center;
    }

    .room {
      font-size: 0.6rem;
      color: #aaa;
      letter-spacing: 0.1em;
    }

    #status {
      font-size: clamp(0.9rem, 5vw, 1.4rem);
      line-height: 1.6;
      text-shadow: 3px 3px 0 #444;
    }

    #status.blink { animation: blink 1s steps(1) infinite; }

    .score {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.5rem;
      font-size: clamp(1.2rem, 7vw, 2rem);
    }

    .score .label { display: block; font-size: 0.5rem; margin-bottom: 0.5rem; }
    #score-p1-label { color: #e04848; }
    #score-p2-label { color: #3f6fe6; }
    .score .mine { text-decoration: underline; text-underline-offset: 0.4em; }

    .hidden { display: none !important; }

    .btn {
      font-family: inherit;
      font-size: clamp(0.8rem, 4.2vw, 1.1rem);
      color: #fff;
      background: #000;
      border: 4px solid #fff;
      box-shadow: 4px 4px 0 #333;
      min-height: 3.75rem;
      padding: 1rem;
      cursor: pointer;
      touch-action: manipulation;
      animation: blink 1s steps(1) infinite;
    }

    .btn:active, .btn:focus-visible {
      background: #fff;
      color: #000;
      animation: none;
      outline: none;
    }

    .btn:disabled { animation: none; opacity: 0.5; }


    .hint {
      font-size: 0.5rem;
      color: #aaa;
      line-height: 2;
    }

    #mode-label { color: #ffd166; }

    /* Lobby (captain picks mode / difficulty / START) and in-game panels */
    .panel { display: flex; flex-direction: column; gap: 0.75rem; }
    #game-panel { flex: 1; min-height: 0; }

    .btn-grid { display: flex; gap: 0.5rem; }
    .btn-grid > * { flex: 1; }

    /* Big thumb-sized pixel buttons */
    .pick {
      font-family: inherit;
      font-size: clamp(0.6rem, 3.4vw, 0.8rem);
      line-height: 1.6;
      color: #fff;
      background: #000;
      border: 4px solid #666;
      box-shadow: 4px 4px 0 #333;
      min-height: 3.5rem;
      padding: 0.5rem;
      cursor: pointer;
      touch-action: manipulation;
    }
    .pick.on { border-color: #fff; background: #23807a; }
    .pick:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #333; }

    .btn.big { font-size: clamp(1.1rem, 6vw, 1.5rem); min-height: 4.5rem; background: #23807a; }

    /* In-game buttons along the bottom, where a thumb reaches while holding the phone */
    .controls .pick { min-height: 4rem; font-size: clamp(0.7rem, 3.8vw, 0.95rem); }
    #pause-btn.on { background: #ffd166; color: #000; border-color: #fff; }

    /* Touch fallback: drag up/down anywhere in this box. */
    #pad {
      position: relative;
      flex: 1;
      min-height: 8rem;
      border: 4px solid #fff;
      touch-action: none;
    }

    #pad .label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.55rem;
      color: #444;
      pointer-events: none;
    }

    #paddle {
      position: absolute;
      left: 50%;
      width: 14px;
      height: 25%;
      margin-left: -7px;
      background: #fff;
      top: 37.5%; /* (100% - 25%) * 0.5 */
      pointer-events: none;
    }

    #pad.smash { border-color: #ff8a3a; }

    /* Spin meter: pixel bar that fills left/right from the centre mark. */
    .spin {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.55rem;
      color: #7ad7ff;
    }
    #spin-meter {
      position: relative;
      flex: 1;
      height: 18px;
      border: 3px solid #fff;
      /* chunky segments */
      background: repeating-linear-gradient(to right, #111 0 8px, #222 8px 10px);
    }
    #spin-meter::after { /* centre mark */
      content: "";
      position: absolute;
      left: calc(50% - 1px);
      top: -6px;
      bottom: -6px;
      width: 2px;
      background: #fff;
    }
    #spin-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 0;
      background: repeating-linear-gradient(to right, #7ad7ff 0 8px, #3aa6d8 8px 10px);
    }

    .smash-hint { font-size: 0.55rem; color: #ff8a3a; }

    /* Full-screen flash (smash landed, hits, points). Colour is set from JS. */
    #flash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0;
    }
    #flash.on { animation: flash 0.35s ease-out; }
    @keyframes flash { from { opacity: 0.7; } to { opacity: 0; } }

    @keyframes blink { 50% { opacity: 0.3; } }

    /* Faint CRT scanlines, matching the home screen */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom, rgba(255,255,255,0.03) 0 2px, transparent 2px 4px
      );
    }
  </style>
</head>
<body>
  <main class="controller">
    <p class="room">ROOM <span id="room-code">----</span> &middot; <span id="mode-label">1V1</span></p>
    <h1 id="status" class="blink">CONNECTING...</h1>

    <!-- Team scores: RED (P1 + P3) vs BLUE (P2 + P4) -->
    <div id="score" class="score hidden">
      <div><span id="score-p1-label" class="label">RED</span><span id="score-p1">0</span></div>
      <div>-</div>
      <div><span id="score-p2-label" class="label">BLUE</span><span id="score-p2">0</span></div>
    </div>

    <button id="motion-btn" class="btn">ENABLE MOTION</button>
    <p id="hint" class="hint">TILT TO MOVE<br>OR DRAG IN THE BOX</p>
    <p id="smash-hint" class="smash-hint hidden">SHAKE TO SMASH!</p>

    <!-- Lobby: only the captain (P1) gets the mode buttons and START -->
    <section id="lobby-panel" class="panel hidden">
      <div id="captain-controls" class="panel hidden">
        <div class="btn-grid">
          <button class="pick" data-mode="1v1">1V1</button>
          <button class="pick" data-mode="2v2">2V2</button>
          <button class="pick" data-mode="coop">CO-OP VS BOTS</button>
        </div>
        <div id="difficulty-row" class="btn-grid hidden">
          <button class="pick" data-diff="easy">EASY BOTS</button>
          <button class="pick" data-diff="hard">HARD BOTS</button>
        </div>
        <button id="start-btn" class="btn big hidden">START</button>
      </div>
      <p id="lobby-info" class="hint"></p>
    </section>

    <section id="game-panel" class="panel hidden">
      <div class="spin">
        <span>SPIN</span>
        <div id="spin-meter"><div id="spin-fill"></div></div>
      </div>

      <div id="pad">
        <div class="label">DRAG UP / DOWN<br><br>SIDEWAYS = SPIN</div>
        <div id="paddle"></div>
      </div>

      <div class="btn-grid controls">
        <button id="recentre-btn" class="pick hidden">RECENTRE</button>
        <button id="pause-btn" class="pick">PAUSE</button>
      </div>
    </section>

    <!-- After a match: everyone can ask for a rematch; only the captain can change mode -->
    <section id="over-panel" class="panel hidden">
      <button id="rematch-btn" class="btn big">REMATCH</button>
      <button id="change-mode-btn" class="pick hidden">CHANGE MODE</button>
    </section>
  </main>
  <div id="flash"></div>

  <!-- Socket.IO JS client v4 matches Flask-SocketIO 5.x -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
  <script src="{{ url_for('static', filename='controller.js') }}"></script>
</body>
</html>
